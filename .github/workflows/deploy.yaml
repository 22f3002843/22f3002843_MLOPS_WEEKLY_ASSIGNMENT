name: Build, Push, and Deploy to GKE

on:
  push:
    branches:
      - week_7
  workflow_dispatch:

env:
  PROJECT_ID: mlops-501911
  GAR_LOCATION: us-central1
  GKE_CLUSTER: mlops-cluster
  GKE_ZONE: us-central1-a
  REPOSITORY: mlops-repo
  IMAGE: iris-app
  WORKLOAD_IDENTITY_PROVIDER: projects/588656205385/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: gh-actions-sa@mlops-501911.iam.gserviceaccount.com

# Explicit permissions required for Keyless OIDC token request
permissions:
  contents: read
  id-token: write

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # Keyless Authentication via Workload Identity Federation
    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v1
      with:
        workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Configure Docker for GCP Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} .
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}

    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v1
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_ZONE }}

    - name: Deploy to GKE
      run: |
        kubectl apply -f k8s/
        kubectl set image deployment/iris-app-deployment iris-app=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}