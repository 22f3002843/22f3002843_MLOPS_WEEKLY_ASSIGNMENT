name: MLOps IRIS Pipeline CI

on:
  push:
    branches:
      - '**'  # Enables CI on every single branch push (Task 4)
  pull_request:
    branches:
      - master
      - main

jobs:
  run-ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Setup Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest sklearn

      # 4. Setup DVC and Authenticate GCS (Task 3)
      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Pull Data and Model from GCS Remote
        env:
          GCP_CREDENTIALS_DATA: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          # Reconstitute service account credentials if needed, or rely on DVC authentication config
          dvc pull

      # 5. Run Pytest Suite
      - name: Run Validation and Evaluation Tests
        run: |
          pytest test_pipeline.py --junitxml=report.xml

      # 6. Setup CML and Publish Report (Task 5)
      - name: Setup CML
        uses: iterative/setup-cml@v1

      - name: Publish CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 🚀 MLOps CI Pipeline Sanity Report" > report.md
          echo "### ✅ Test Execution Summary" >> report.md
          echo "All structural data checks and minimum model accuracy thresholds passed successfully." >> report.md
          
          # Publish comment to the PR
          cml comment create report.md
